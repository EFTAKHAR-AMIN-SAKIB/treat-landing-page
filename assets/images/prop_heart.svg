<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <!-- Heart 3D Bubble Gradient -->
    <radialGradient id="heartGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#C092FF" />
      <stop offset="25%" stop-color="#9357E8" />
      <stop offset="65%" stop-color="#6F32C9" />
      <stop offset="100%" stop-color="#46188A" />
    </radialGradient>
    <!-- Specular Highlight -->
    <radialGradient id="heartGloss" cx="35%" cy="25%" r="45%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="45%" stop-color="#E1CCFF" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#9357E8" stop-opacity="0" />
    </radialGradient>
    <filter id="heartShadow" x="-25%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#320C69" flood-opacity="0.35" />
    </filter>
  </defs>

  <g filter="url(#heartShadow)">
    <!-- 3D Puffy Heart Shape -->
    <path d="M 60 102 C 60 102, 16 74, 16 42 C 16 22, 32 14, 46 14 C 54 14, 60 18, 60 22 C 60 18, 66 14, 74 14 C 88 14, 104 22, 104 42 C 104 74, 60 102, 60 102 Z" fill="url(#heartGrad)" />

    <!-- Glossy Bubble Highlights -->
    <ellipse cx="44" cy="32" rx="14" ry="9" transform="rotate(-30 44 32)" fill="url(#heartGloss)" />
    <ellipse cx="40" cy="28" rx="5" ry="3" transform="rotate(-30 40 28)" fill="#FFFFFF" opacity="0.8" />
    <ellipse cx="78" cy="34" rx="8" ry="5" transform="rotate(25 78 34)" fill="#FFFFFF" opacity="0.45" />

    <!-- Bottom Rim Light -->
    <path d="M 36 78 C 45 88, 54 94, 60 98 C 66 94, 75 88, 84 78" stroke="#DAB8FF" stroke-width="2.5" stroke-linecap="round" opacity="0.4" />
  </g>
</svg>
