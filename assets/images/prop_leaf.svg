<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <!-- Leaf Surface Gradient -->
    <linearGradient id="leafSurface" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#84CE38" />
      <stop offset="35%" stop-color="#55A81F" />
      <stop offset="75%" stop-color="#3A7E11" />
      <stop offset="100%" stop-color="#23520A" />
    </linearGradient>
    <!-- Leaf Gloss Gradient -->
    <linearGradient id="leafGloss" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.55" />
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#3A7E11" stop-opacity="0" />
    </linearGradient>
    <!-- Shadow Filter -->
    <filter id="leafShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="2" dy="12" stdDeviation="10" flood-color="#143006" flood-opacity="0.3" />
    </filter>
  </defs>

  <g filter="url(#leafShadow)">
    <!-- Main Leaf Body (Smooth organic curve) -->
    <path d="M 20 100 C 18 65, 45 25, 96 15 C 102 48, 86 86, 36 102 C 28 102, 22 101, 20 100 Z" fill="url(#leafSurface)" />
    
    <!-- Leaf Half (Darker side for 3D depth) -->
    <path d="M 20 100 C 18 65, 45 25, 96 15 C 80 40, 60 70, 20 100 Z" fill="#2E6A0D" opacity="0.45" />

    <!-- Specular Highlight Curve -->
    <path d="M 32 82 C 42 58, 64 36, 88 22 C 78 35, 58 56, 42 86 Z" fill="url(#leafGloss)" />

    <!-- Central Vein -->
    <path d="M 20 100 Q 56 60 96 15" stroke="#9EE652" stroke-width="2" stroke-linecap="round" opacity="0.8" />

    <!-- Side Veins -->
    <path d="M 40 82 Q 52 82 62 88" stroke="#9EE652" stroke-width="1.2" stroke-linecap="round" opacity="0.5" />
    <path d="M 50 68 Q 65 65 78 72" stroke="#9EE652" stroke-width="1.2" stroke-linecap="round" opacity="0.5" />
    <path d="M 64 52 Q 78 48 88 54" stroke="#9EE652" stroke-width="1.2" stroke-linecap="round" opacity="0.5" />
    <path d="M 42 80 Q 32 72 26 70" stroke="#75BA27" stroke-width="1.2" stroke-linecap="round" opacity="0.4" />
    <path d="M 56 62 Q 44 54 38 50" stroke="#75BA27" stroke-width="1.2" stroke-linecap="round" opacity="0.4" />
    <path d="M 72 44 Q 60 36 54 32" stroke="#75BA27" stroke-width="1.2" stroke-linecap="round" opacity="0.4" />
  </g>
</svg>
